<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="上下文洞察">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d2130"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#48c78e"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="27.5" fill="none" stroke="#2a2f3f"/>

  <!-- outer gauge: how full the context window is -->
  <circle cx="64" cy="60" r="34" fill="none" stroke="#2a2f3f" stroke-width="9"/>
  <circle cx="64" cy="60" r="34" fill="none" stroke="url(#bar)" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="171 214"
          transform="rotate(-90 64 60)"/>

  <!-- inner bars: token composition -->
  <rect x="50" y="48" width="7" height="24" rx="3.5" fill="#7aa2ff"/>
  <rect x="60.5" y="40" width="7" height="32" rx="3.5" fill="#48c78e"/>
  <rect x="71" y="54" width="7" height="18" rx="3.5" fill="#ffb454"/>

  <!-- baseline -->
  <rect x="40" y="78" width="48" height="3" rx="1.5" fill="#2a2f3f"/>

  <!-- label dots -->
  <circle cx="46" cy="94" r="3.5" fill="#7aa2ff"/>
  <circle cx="64" cy="94" r="3.5" fill="#48c78e"/>
  <circle cx="82" cy="94" r="3.5" fill="#ffb454"/>
</svg>
